{n:'Arrays',d:'Array operations: traversal, insertion, deletion (shift elements, O(n)) and search. Contiguous memory.',S:()=>({a:[10,20,30]}),p:1,dr:S=>cells(pad(S.a,8)),ops:[['Insert (value @ pos)',(S,v,p)=>{if(S.a.length>=8||p<0||p>S.a.length)return'Invalid';S.a.splice(p,0,v);return`Shifted right, a[${p}]=${v}`}],['Delete @ pos',(S,v,p)=>{if(p<0||p>=S.a.length)return'Invalid';S.a.splice(p,1);return`Shifted left, removed index ${p}`}]],c:R`#include <stdio.h>
#define MAX 8
int a[MAX], n = 3;           // a = {10,20,30}

void insert(int val, int pos) {          // O(n)
    if (n == MAX || pos < 0 || pos > n) { printf("Invalid\n"); return; }
    for (int i = n; i > pos; i--) a[i] = a[i-1];   // shift right
    a[pos] = val; n++;
}
void delete_at(int pos) {                // O(n)
    if (pos < 0 || pos >= n) { printf("Invalid\n"); return; }
    for (int i = pos; i < n-1; i++) a[i] = a[i+1]; // shift left
    n--;
}
void display() { for (int i = 0; i < n; i++) printf("%d ", a[i]); }`},

#define MAX 6
int stack[MAX], top = -1;

void push(int x) {
    if (top == MAX - 1) { printf("Stack Overflow\n"); return; }
    stack[++top] = x;                    // increment then store
}
int pop() {
    if (top == -1) { printf("Stack Underflow\n"); return -1; }
    return stack[top--];                 // return then decrement
}
int peek() {
    if (top == -1) { printf("Stack is empty\n"); return -1; }
    return stack[top];
}`},
{n:'Queue',d:'Simple Queue: FIFO. Enqueue at rear, dequeue at front (linear array queue).',S:()=>({a:Array(6).fill(null),f:0,r:-1}),dr:S=>cells(S.a,[],[],lab({front:S.f<=S.r?S.f:-1,rear:S.r})),ops:[['enqueue',(S,v)=>S.r==5?'Queue Overflow (rear == MAX-1)':(S.a[++S.r]=v,`enqueue(${v}): rear++`)],['dequeue',S=>S.f>S.r?'Queue Underflow':(S.a[S.f]=null,`dequeue() returned item, front++`,S.f++,'dequeue: front++')]],c:R`#include <stdio.h>

int q[MAX], front = 0, rear = -1;

void enqueue(int x) {
    if (rear == MAX - 1) { printf("Queue Overflow\n"); return; }
    q[++rear] = x;
}

{n:'Circular Queue',d:'Indexes wrap around using the modulus operator, so freed slots are reused.',S:()=>({a:Array(5).fill(null),f:0,n:0}),dr:S=>cells(S.a,[],[],lab({front:S.n?S.f:-1,rear:S.n?(S.f+S.n-1)%5:-1})),ops:[['enqueue',(S,v)=>S.n==5?'Queue Full (count == MAX)':(S.a[(S.f+S.n++)%5]=v,`rear = (rear+1) % 5, store ${v}`)],['dequeue',S=>S.n?(S.a[S.f]=null,S.f=(S.f+1)%5,S.n--,'front = (front+1) % 5'):'Queue Empty']],c:R`#include <stdio.h>
#define MAX 5
int q[MAX], front = 0, rear = -1, count = 0;

void enqueue(int x) {
    if (count == MAX) { printf("Queue Full\n"); return; }
    rear = (rear + 1) % MAX;             // wrap around
    q[rear] = x; count++;
}
int dequeue() {
    if (count == 0) { printf("Queue Empty\n"); return -1; }
    int x = q[front];
    front = (front + 1) % MAX;           // wrap around
    count--; return x;

{n:'Linked List',d:'Nodes linked by pointers; allocated dynamically with malloc.',S:()=>({a:[]}),dr:S=>nodes(S.a),ops:[['Insert front',(S,v)=>(S.a.unshift(v),`new node ${v}; next = head; head = new`)],['Insert end',(S,v)=>(S.a.push(v),`traverse to last node; last->next = new node ${v}`)],['Delete front',S=>S.a.length?(S.a.shift(),'head = head->next; free(old)'):'List empty'],['Delete value',(S,v)=>{const i=S.a.indexOf(v);return i<0?'Value not found':(S.a.splice(i,1),`unlinked and freed ${v}`)}]],c:R`#include <stdio.h>

struct Node { int data; struct Node *next; };
struct Node *head = NULL;

void insertFront(int x) {

    n->data = x; n->next = head; head = n;

void insertEnd(int x) {
    struct Node *n = (struct Node*)malloc(sizeof(struct Node));

struct Node { int data; struct Node *next; };
struct Node *last = NULL;      // keep pointer to last node

void insertEnd(int x) {
    struct Node *n = (struct Node*)malloc(sizeof(struct Node));
    n->data = x;
    if (last == NULL) { n->next = n; last = n; return; }

{n:'Binary Search Tree',d:'Left subtree is smaller, right subtree is larger.',S:()=>({t:null}),dr:S=>bd(S.t,S.hl),ops:[['Insert',(S,v)=>(S.hl=[v],S.t=bins(S.t,v),`insert(${v}) recursively`)],['Search',(S,v)=>{let t=S.t,p=[];while(t){p.push(t.v);if(t.v==v)break;t=v<t.v?t.l:t.r}S.hl=p;return t?`Found ${v}`:`${v} not found`}],['Delete',(S,v)=>{const had=trav(S.t,1).includes(v);S.t=bdel(S.t,v);S.hl=[];return had?`Deleted ${v}`:`${v} not found`}],['Inorder',S=>(S.hl=[],'Inorder: '+trav(S.t,1).join(' '))],['Preorder',S=>'Preorder: '+trav(S.t,0).join(' ')],['Postorder',S=>'Postorder: '+trav(S.t,2).join(' ')]],c:R`#include <stdio.h>
#include <stdlib.h>
struct Node { int data; struct Node *left, *right; };

struct Node* newNode(int x) {
    struct Node *n = (struct Node*)malloc(sizeof(struct Node));
    n->data = x; n->left = n->right = NULL; return n;
}
struct Node* insert(struct Node *root, int x) {
    if (root == NULL) return newNode(x);
    if (x < root->data) root->left  = insert(root->left, x);
    else                root->right = insert(root->right, x);
    return root;
}
struct Node* search(struct Node *root, int x) {
    if (root == NULL || root->data == x) return root;
    return x < root->data ? search(root->left, x) : search(root->right, x);
}
struct Node* minNode(struct Node *r) { while (r->left != NULL) r = r->left; return r; }
struct Node* deleteNode(struct Node *root, int x) {
    if (root == NULL) return NULL;
    if (x < root->data) root->left = deleteNode(root->left, x);
    else if (x > root->data) root->right = deleteNode(root->right, x);
    else {

sx('Hash Functions & Collisions','Hash function maps a key to a table index: division h = k % size, mid-square, folding. A symbol table stores (name, value) pairs, such as a compiler keeping identifiers. Collision: two keys get the same index. Resolve by chaining (linked list per slot) or open addressing (linear or quadratic probing, see Hashing).',dg(`Keys 12, 22, 7, 15, 32 with size 5 (chaining)

void insert(int key) {
    int i = key % SIZE;                                  // hash function
    struct Node *n = malloc(sizeof(struct Node));
    n->key = key; n->next = table[i]; table[i] = n;      // collision: add to chain
}
int search(int key) {
    for (struct Node *t = table[key % SIZE]; t != NULL; t = t->next)
        if (t->key == key) return 1;
    return 0;
}
